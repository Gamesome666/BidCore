name: 功能建议
description: 提一个能力/体验上的改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是先说方案
      placeholder: 三级审核里，第 2 级指派人休假时审批会卡住，只能手动转派
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的想法
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 工作流引擎 / Supervisor
        - HITL 审核中心
        - Self-Loop 质量闭环
        - 技术方案流水线 / 导出
        - 知识库 / Agent / 编排模板
        - 前端页面
        - 文档 / 工具链
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该能力可以做到零 npm 依赖（优先用 Node 内置模块）
          required: true
        - label: 我愿意自己提 PR
          required: false
